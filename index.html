<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="nome" content="empresa Erosart">
    <link rel="stylesheet" href="style.css">
    <title>Erosart</title>
</head>

<body class="primeiro">

    <h3 class="empresa">EROSART</h3>

    <div class="navegador">
        <a class="Erosart" href="index.html">Home</a>
        <a class="produtos" href="produtos.html">Produtos</a>
        <a class="sobrenos" href="sobrenos.html">Sobre-Nós</a>
    </div>

    <h3 class="representar">Venda de Materiais Eletrónicos</h3>

    <img class="imagem" src="produtos.png" alt="materias eletronicos">

    <div class="formulario">

    <div class="container">
        <input type="date" name="data" id="data">
        <label for="">Data</label>
    </div>

    <div class="container">
        <input type="text" name="nome" id="nome">
        <label for="">Nome</label>
    </div>

    <div class="container">
        <input type="number" name="contacto" id="contacto">
        <label for="">Contacto</label>
    </div>

    <div class="container">
        <input type="text" name="localizacao" id="localizacao">
        <label for="">Localização</label>
    </div>

    <div class="container">
        <input type="text" name="material" id="material" list="listaMateriais">
        <label for="material">Material</label>

        <datalist id="listaMateriais">
            <option value="arduino mega"></option>
            <option value="arduino nano"></option>
            <option value="arduino uno"></option>
            <option value="botão"></option>
            <option value="capacitor ceramico"></option>
            <option value="capacitor eletrolítico"></option>
        </datalist>
    </div>

    <div class="container">
        <input type="number" name="quantidade" id="quantidade" value="1" min="1">
        <label for="quantidade">Quantidade</label>
    </div>

    <div class="container">
        <button type="button" class="but" onclick="adicionarMaterial()">Adicionar Material</button>
    </div>

    <div class="caixaMateriais">
        <h3>Materiais adicionados</h3>
        <div id="verMateriais"></div>
        <h3 id="total">Total: 0 kz</h3>
    </div>
    
    <div class="container">
        <button class="bot" onclick="encomendar()">Encomendar</button>
    </div>

    <div class="rodape">
        <p>© 2026 Erosart - Vendas de Materias Eletrónicos</p>
        <p>📞 +244 974519069</p>
        <P>✉ herosmitepedro@gmail.com</P>
        <p>facebook: Erosart</p>
        <p>📍 Luanda, Angola</p>
        
    </div>

    </div>
    <script src="script.js"></script>
</body>
</html>
